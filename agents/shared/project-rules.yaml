source_of_truth: Git repository
technical_reference_branch: green-house/qa
frozen_baselines:
- HU-001
- HU-002
- HU-003
- HU-004
- HU-005
- HU-006
- HU-007
- HU-008
- HU-009
authority:
  A0: read/analyze
  A1: propose/generate
  A2: authorized reversible execution
  A3: human approval required
rules:
- Never silently modify frozen baselines
- Never invent pinouts, voltages, protocols, registers, agronomic rules or implementation
  status
- Existing implementation with evidence is not recreated by default
- Operational does not imply calibrated or validated
- Sensor test plans must separate functional response, characterization and calibration
  using `project/validation/sensor-test-rigor.yaml`
- Sensor calibration or accuracy claims require an independent reference method,
  measured conditions and explicit limitations
- No agent may generate, approve and persist as final when independent review is required
- Physical control, purchases, paid media spend and critical deployment require human
  approval
- No item may be recommended for execution from READY, IN_PROGRESS, VALIDATION or
  DONE unless it passes `project/validation/state-gates.yaml`
- Executable items in READY or beyond require acceptance criteria, Gherkin or
  approved exception, DoR, DoD, evidence expected and clear granularity
- Parent items in READY are coordination containers only; execution must happen
  through child HUs or tasks with their own criteria and evidence
- When the human says "nueva HU", "creemos una HU", "salio otra HU",
  "trabajemos esta HU", "antes de seguir refinemos" or equivalent, agents must
  route to refinement first and produce/update the HU contract before execution
- A HU contract is complete only when it has problem, outcome, scope, expert_role,
  reviewer_role, acceptance_criteria, gherkin_scenarios or approved exception,
  definition_of_ready, definition_of_done, evidence_expected, risks,
  dependencies/open blockers and next_action
- Engineering agents must refuse implementation when the selected HU lacks the HU
  contract, except for reversible discovery/refinement work explicitly requested
