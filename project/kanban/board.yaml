workflow:
- IDEA
- BACKLOG
- REFINEMENT
- READY
- IN_PROGRESS
- VALIDATION
- DONE
wip_limits:
  IN_PROGRESS: 2
  VALIDATION: 3
selection_modes:
  quick_win:
    description: Trabajo pequeno, de bajo riesgo, que deja avance visible.
    preferred_effort:
    - XS
    - S
  deep_work:
    description: Trabajo de foco largo que desbloquea ruta critica o arquitectura.
    preferred_effort:
    - M
    - L
  physical_lab:
    description: Trabajo con sensores, cableado, mediciones, actuadores o pruebas de campo.
  coding:
    description: Trabajo que puede avanzar con agente de ingenieria y pruebas locales.
  docs_governance:
    description: Refinamiento, backlog, decisiones, V&V, evidencia y arquitectura.
  market_growth:
    description: Mercado, contenido, claims, descubrimiento y crecimiento.
