rules:
- Una HU debe tener exactamente un rol experto responsable.
- El revisor no debe ser el mismo rol cuando hay riesgo medio o alto.
- El rol experto define el lenguaje, criterios y evidencia de la HU.
- Si una HU necesita dos roles expertos principales, se debe dividir o crear subtareas claramente separadas.
- Los agentes asociados a roles no pueden exceder la autoridad definida en las reglas del proyecto.
