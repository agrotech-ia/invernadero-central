    - Guardado directo en Git sin revision.
  acceptance_criteria:
  - El usuario puede generar YAML DRAFT valido.
  - La HU creada queda marcada como propuesta local.
  evidence_expected:
  - diff web
  - YAML ejemplo

- id: HU-WEB-KANBAN-005
