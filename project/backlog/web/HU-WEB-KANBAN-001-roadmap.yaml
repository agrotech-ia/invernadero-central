  type: STORY
  status: DONE
  priority: P1
  target: FOUNDATION
  expert_role: Frontend Engineer
  reviewer_role: QA Engineer
  effort: S
  dependencies:
  - HU-WEB-KANBAN-001
  problem: El flujo principal no guiaba al usuario desde la landing hacia las vistas operativas del proyecto.
  outcome: La landing presenta accesos directos a Kanban y Laboratorios y la navegacion del navbar soporta ambas rutas.
  scope:
