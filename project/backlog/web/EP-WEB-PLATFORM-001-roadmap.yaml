- id: EN-AWS-ARCH-001
  title: Formalizar arquitectura AWS SaaS piloto
  type: ENABLER
  status: READY
  priority: P0
  target: MVP
  expert_role: Solution / IoT Architect
  reviewer_role: DevOps / Platform Engineer
  effort: S
  dependencies: []
  problem: El proyecto necesita una arquitectura AWS piloto que permita evolucionar a SaaS sin sobredimensionar el primer despliegue.
  outcome: Decisiones AWS iniciales listas para implementar sin sobreingenieria.
  scope:
    in:
    - Principios de multi-tenant by design y piloto simple.
    - Servicios AWS candidatos por capa.
    - Decisiones pendientes antes de implementar.
    - Criterios para extraer microservicios mas adelante.
    out:
    - Provisionamiento real de infraestructura.
    - Deploy critico a produccion.
    - Implementacion de autenticacion o backend.
  acceptance_criteria:
  - Existe arquitectura objetivo versionada.
  - La arquitectura distingue piloto simple de SaaS multi-tenant futuro.
  - Se documentan servicios AWS ya confirmados y servicios candidatos.
  - Se explicitan decisiones pendientes antes de implementacion.
  - Se evita microservicios fisicos prematuros sin perder limites de dominio.
  gherkin_scenarios:
  - name: Evaluar arquitectura sin sobreingenieria
    given:
    - El proyecto ya tiene S3, CloudFront, Route53 y ACM.
    when:
    - Se revisa la arquitectura AWS piloto.
    then:
    - La arquitectura separa diseño SaaS de complejidad operativa inicial.
    - Las decisiones pendientes quedan visibles antes de implementar.
  definition_of_ready:
  - Estado AWS confirmado por humano.
  - Objetivo SaaS piloto definido.
  - Rol experto y revisor asignados.
  - Evidencia esperada definida.
  definition_of_done:
  - Documento de arquitectura versionado.
  - Decisiones pendientes listadas.
  - Revisor valida que no hay implementacion critica sin aprobacion.
  - Siguiente HU tecnica puede derivarse con contratos claros.
  evidence_expected:
  - project/architecture/aws-saas-target-architecture.md
  - decision register actualizado
