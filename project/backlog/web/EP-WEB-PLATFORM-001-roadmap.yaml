epic:
  id: EP-WEB-PLATFORM-001
  title: Plataforma web comercial y SaaS operativa
  status: DRAFT
  priority: P0
  target: MVP
  source_refs:
  - project/architecture/aws-saas-target-architecture.md
  - project/backlog/epic-map.yaml
  - project/kanban/board.yaml

principles:
- La landing publica vende la solucion y genera interes comercial.
- La aplicacion privada opera por roles y permisos.
- El piloto puede iniciar con un tenant, pero el modelo debe soportar multiples tenants.
- Separar chat interno de proyecto y chat agricola para usuarios finales.
- Usar datos mock contractuales antes de conectar telemetria real.
- No crear microservicios fisicos sin contrato, dominio y necesidad operativa.

roles:
- id: admin
  name: Admin / Operador
  goals:
  - crear y administrar tenants/invernaderos
  - gestionar usuarios y permisos
  - registrar dispositivos/sensores
  - revisar estado global
- id: farmer
  name: Agricultor
  goals:
  - ver estado actual del cultivo
  - recibir alertas accionables
  - revisar tableros y estadisticas para decidir
  - consultar historial simple de acciones
- id: agronomist
  name: Agronomo
  goals:
  - analizar datos por cultivo e invernadero
  - aprobar/rechazar recomendaciones
  - dejar observaciones tecnicas
  - consultar historial de decisiones
- id: technician
  name: Tecnico / Instalador
  goals:
  - registrar instalacion y mantenimiento
  - validar conectividad de sensores
  - reportar fallas
- id: owner
  name: Owner / Empresa
  goals:
  - ver metricas globales
  - revisar clientes/invernaderos activos
  - entender salud operativa y pipeline comercial

phases:
- id: WEB-PHASE-001
  title: Producto, roles y navegacion
  objective: Definir experiencia SaaS sin implementar backend complejo.
  stories:
  - HU-WEB-ROLE-001
  - HU-WEB-IA-001
  - HU-WEB-LANDING-001
- id: WEB-PHASE-002
  title: App privada mock contractual
  objective: Crear pantallas privadas por rol usando datos mock compatibles con contratos futuros.
  stories:
  - HU-WEB-SHELL-001
  - HU-WEB-GREENHOUSE-001
  - HU-WEB-DASH-FARMER-001
  - HU-WEB-DASH-AGRONOMIST-001
- id: WEB-PHASE-003
  title: AWS/backend foundation
  objective: Diseñar y preparar API, auth, tenant y persistencia minima.
  stories:
  - EN-AWS-ARCH-001
  - HU-AUTH-001
  - HU-API-TENANT-001
  - HU-API-GREENHOUSE-001
- id: WEB-PHASE-004
  title: Telemetria, alertas y decisiones
  objective: Conectar datos reales o simulados contractualmente.
  stories:
  - HU-WEB-TELEM-001
  - HU-WEB-ALERT-001
  - HU-WEB-DECISION-001
- id: WEB-PHASE-005
  title: Agro Expert Chat
  objective: Crear chat agricola para usuarios finales con fuentes cientificas y contexto del cultivo.
  stories:
  - EN-AGRO-KNOW-001
  - HU-AGRO-CHAT-001
  - HU-AGRO-CHAT-RAG-001

stories:
- id: HU-WEB-ROLE-001
  title: Definir roles, permisos y matriz de pantallas
  type: STORY
  status: VALIDATION
  priority: P0
  target: MVP
  expert_role: Product Manager
  reviewer_role: Solution / IoT Architect
  effort: S
  dependencies: []
  problem: La web necesita separar usuarios, permisos y pantallas antes de implementar navegacion privada o dashboards por rol.
  outcome: Matriz versionada rol -> permisos -> pantallas -> acciones.
  scope:
    in:
    - Roles iniciales: admin, agricultor, agronomo, tecnico/instalador y owner/empresa.
    - Permisos por rol.
    - Pantallas comunes y especificas.
    - Acciones permitidas por rol.
    out:
    - Implementacion de autenticacion.
    - Persistencia real de permisos.
    - Pantallas finales con datos reales.
  acceptance_criteria:
  - La matriz define roles iniciales y responsabilidades.
  - Cada rol tiene pantallas permitidas y acciones principales.
  - La matriz distingue pantallas comunes de pantallas especificas.
  - La matriz identifica dependencias para navegacion, autenticacion y dashboard.
  gherkin_scenarios:
  - name: Admin consulta capacidades por rol
    given:
    - Existe una matriz versionada de roles y pantallas.
    when:
    - Se revisa el rol Admin.
    then:
    - Se listan pantallas y acciones permitidas para administrar invernaderos.
    - Se identifican dependencias para autenticacion y permisos.
  - name: Agronomo consulta decisiones pendientes
    given:
    - Existe una matriz versionada de roles y pantallas.
    when:
    - Se revisa el rol Agronomo.
    then:
    - Se listan pantallas de alertas, recomendaciones pendientes e historial de decisiones.
    - Se diferencian acciones de consulta, aprobacion o recomendacion.
  definition_of_ready:
  - Requerimiento de tipos de usuario definido.
  - Roles experto y revisor asignados.
  - Evidencia esperada identificada.
  definition_of_done:
  - Matriz versionada en project/product/web-role-screen-matrix.yaml.
  - Criterios de aceptacion cubiertos.
  - Revisor confirma que desbloquea HU-WEB-IA-001.
  evidence_expected:
  - project/product/web-role-screen-matrix.yaml
  - revision de arquitectura
  evidence:
  - project/product/web-role-screen-matrix.yaml
  next_action: Revisar matriz y aprobar desbloqueo de HU-WEB-IA-001.
