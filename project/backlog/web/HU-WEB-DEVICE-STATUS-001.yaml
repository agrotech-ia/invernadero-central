id: HU-WEB-DEVICE-STATUS-001
title: Mostrar estado real de dispositivos desde Raspberry
type: STORY
status: DONE
priority: P0
target: MVP
expert_role: Frontend Engineer
reviewer_role: QA Engineer
dependencies:
- HU-OPS-SENSOR-LIVENESS-001
- HU-EDGE-INGESTOR-001
problem: El operador no debe depender de consola, Serial o `mosquitto_sub` para saber si un ESP esta vivo, atrasado o caido.
outcome: La web muestra estado operativo real de sensores usando un snapshot JSON exportado desde SQLite en Raspberry.
scope:
  in:
  - Ruta `/project/dispositivos`.
  - Snapshot JSON `/edge/device-health.json`.
  - Cards de dispositivos con estado, ultimo visto, secuencia, MQTT y ultimo chequeo.
  - Conteos de MQTT, lecturas, recovery y reconstruidas.
  - Eventos recientes de liveness.
  out:
  - API HTTP dinamica.
  - Autenticacion.
  - Notificaciones externas.
acceptance_criteria:
- La ruta `/project/dispositivos` carga sin romper build.
- La UI lee `/edge/device-health.json` por defecto o `VITE_EDGE_HEALTH_URL` cuando consume una Raspberry remota.
- La UI muestra `online/warning/critical/offline`.
- Raspberry puede exportar el JSON desde `var/edge/greenhouse.db`.
- Existe timer systemd opcional para export periodico.
- La web muestra estado `online` usando datos reales de Raspberry.
evidence:
- web:src/pages/ProjectDeviceStatusPage.jsx
- web:src/App.jsx
- web:src/sections/Navbar.jsx
- web:public/edge/device-health.json
- tools/edge_export_device_health.py
- deploy/systemd/greenhouse-edge-health-export.service
- deploy/systemd/greenhouse-edge-health-export.timer
- deploy/systemd/greenhouse-edge-health-http.service
- tools/edge_health_http_server.py
- project/guides/edge/device-health-web-export-runbook.md
- project/evidence/web/HU-WEB-DEVICE-STATUS-001-implementation-2026-09-22.md
- project/evidence/web/HU-WEB-DEVICE-STATUS-001-raspberry-validation-2026-09-22.md
risks:
- risk: Snapshot estatico puede quedar viejo si el exportador no corre.
  mitigation: Timer systemd cada minuto y mostrar `generated_at` en la UI.
- risk: La ruta del repo web puede variar entre laptop y Raspberry.
  mitigation: Documentar `--out` configurable y ajustar systemd por ambiente.
- risk: Servicios systemd copiados desde ambiente de desarrollo pueden conservar `WorkingDirectory` incorrecto.
  mitigation: Unit files de Raspberry usan `/home/chuchosam/greenhouse/invernadero-central` y la guia incluye verificacion con `systemctl cat`.
