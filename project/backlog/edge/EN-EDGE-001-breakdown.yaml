id: EN-EDGE-001
title: Validar runtime Raspberry MQTT a DB
type: ENABLER
status: IN_PROGRESS
priority: P0
target: MVP
owner_role: DevOps / Platform Engineer
reviewer_role: QA Engineer
decision:
  lab_storage_engine: sqlite
  production_target_engine: postgres
  migration_strategy: storage_adapter_and_equivalent_migrations
  rationale: Probar hoy en Raspberry sin dependencias externas, manteniendo modelo de datos y capa de persistencia compatible con PostgreSQL.
architecture:
  ingestion_source: mosquitto_sub_stdout
  input_format: mosquitto_sub -v topic payload
  package: edge.ingestor
  storage_adapter:
    current: SqliteStorage
    future: PostgresStorage
  raw_payload_policy: always_store_original_mqtt_payload
  quality_policy:
  - raw
  - raw_replayed
  - summary_replayed
  - reconstructed_from_summary
stories:
- id: HU-EDGE-DB-001
  title: Crear almacenamiento edge SQLite compatible con PostgreSQL
  type: STORY
  status: VALIDATION
  priority: P0
  outcome: Raspberry guarda mensajes MQTT, lecturas, resumenes offline, puntos reconstruidos y liveness en SQLite.
  acceptance_criteria:
  - Existe migracion SQLite versionada.
  - Existe migracion PostgreSQL equivalente en DRAFT.
  - El payload MQTT crudo se conserva sin perdida.
  - Las lecturas se deduplican por dispositivo, secuencia, sensor y metrica.
  evidence:
  - edge/storage/migrations/sqlite/001_init.sql
  - edge/storage/migrations/postgres/001_init.sql
- id: HU-EDGE-INGESTOR-001
  title: Ingerir MQTT desde Mosquitto hacia almacenamiento edge
  type: STORY
  status: VALIDATION
  priority: P0
  outcome: Un proceso en Raspberry consume `mosquitto_sub -v` y persiste cada mensaje usando adaptador de almacenamiento.
  acceptance_criteria:
  - Lee lineas `topic payload` desde stdin.
  - Clasifica `/telemetry`, `/telemetry/recovery`, `/status` y otros topics.
  - Actualiza `device_liveness`.
  - Genera eventos de gaps por salto de secuencia.
  evidence:
  - edge/ingestor/main.py
  - edge/ingestor/storage.py
  - deploy/systemd/greenhouse-edge-ingestor.service
  - tools/edge_sqlite_status.py
  - project/guides/edge/sqlite-mqtt-ingestor-runbook.md
  - project/evidence/edge/HU-EDGE-INGESTOR-001-local-validation-2026-09-17.md
- id: HU-EDGE-OFFLINE-RECOVERY-001
  title: Reconstruir recuperacion offline en Raspberry
  type: STORY
  status: VALIDATION
  priority: P0
  outcome: El edge persiste `telemetry/recovery` y crea puntos visuales reconstruidos con calidad explicita.
  acceptance_criteria:
  - Guarda resumenes offline.
  - Guarda estadisticos por metrica.
  - Crea puntos reconstruidos en el punto medio de cada ventana.
  - Marca `quality=reconstructed_from_summary`.
  evidence:
  - project/contracts/mqtt/offline-recovery-v1.md
  - edge/ingestor/storage.py
- id: HU-OPS-SENSOR-LIVENESS-001
  title: Registrar ultimo visto por sensor
  type: STORY
  status: READY
  priority: P0
  outcome: La base permite detectar sensores/gateway sin datos recientes.
  acceptance_criteria:
  - "`device_liveness` contiene ultimo mensaje recibido."
  - Distingue ultima telemetria y ultimo status.
  - Conserva ultimo sequence conocido.
  evidence:
  - edge/storage/migrations/sqlite/001_init.sql
  - project/guides/edge/sqlite-mqtt-ingestor-runbook.md
risks:
- risk: SQLite resuelve laboratorio pero no concurrencia productiva multiusuario.
  mitigation: Mantener adaptador y migracion PostgreSQL equivalente desde el inicio.
- risk: Confundir dato reconstruido con medicion real.
  mitigation: Campo `quality` obligatorio y payload original conservado.
- risk: Apagar Raspberry impide medir y recibir datos.
  mitigation: HU-OPS-SENSOR-LIVENESS-001 debe activar alertas por `last_seen`.
