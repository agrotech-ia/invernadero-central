  title: Operacionalizar Knowledge Agent en Kiro, n8n y chat gateway
  status: DONE
  completed_at: '2026-08-22'
  evidence:
  - project/evidence/agents/AGENT-KNOW-001-2026-08-22.md
  - commit:394333c
  notes:
  - project-knowledge esta registrado en Kiro.
  - AGENT-KNOW-001 tiene webhook n8n /webhook/project-knowledge.
  - CHAT-GATEWAY-001 enruta preguntas de contexto a project-knowledge.
  - La ejecucion live devolvio respuesta con fuentes y contradicciones.
- task_id: T-AGT-BKL-001
  title: Convertir Backlog Agent a recomendacion dinamica con Kiro/runner
  status: DONE
  completed_at: '2026-08-22'
  evidence:
  - project/evidence/agents/AGENT-BKL-001-dynamic-2026-08-22.md
  notes:
  - AGENT-BKL-001 tiene webhook n8n /webhook/project-backlog.
  - El workflow llama a project-backlog via agent-runner.
