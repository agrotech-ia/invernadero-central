  title: Definir taxonomia y estructura de evidencia por tipo de trabajo
  type: TASK
  status: READY
  priority: P0
  role: QA Engineer
  agent: AGENT-QA-001
  can_agent_execute: true
  output_artifacts:
  - project/validation/evidence-taxonomy.yaml
  - project/evidence/README.md
  evidence_expected:
  - YAML valido.
  - README con ejemplos por tipo de evidencia.
- id: T-QA-002
  title: Crear plantilla de evidence index por HU/enabler
  type: TASK
  status: READY
  priority: P0
  role: QA Engineer
  agent: AGENT-QA-001
  can_agent_execute: true
  output_artifacts:
  - project/validation/templates/evidence-index.yaml
  evidence_expected:
  - Plantilla YAML valida.
  - Campos para evidencia, fuente, fecha, comando, resultado, reviewer y limitaciones.
- id: T-QA-003
  title: Crear plantilla de validation report por HU/enabler
  type: TASK
  status: READY
  priority: P0
  role: QA Engineer
  agent: AGENT-QA-001
  can_agent_execute: true
  output_artifacts:
  - project/validation/templates/validation-report.yaml
  evidence_expected:
  - Plantilla YAML valida.
  - Decision QA limitada a READY_RECOMMENDED, VALIDATION_RECOMMENDED, DONE_READY, CHANGES_REQUIRED o BLOCKED.
- id: T-QA-004
  title: Definir gates Kanban READY, VALIDATION y DONE
  type: TASK
  status: READY
  priority: P0
  role: QA Engineer
  agent: AGENT-QA-001
  can_agent_execute: true
  output_artifacts:
  - project/validation/kanban-gates.yaml
  evidence_expected:
  - Reglas por estado.
  - Evidencia minima por tipo de item.
  - Condiciones que obligan review humana.
- id: T-QA-005
  title: Crear paquete QA inicial para EN-EDGE-001
  type: TASK
  status: READY
  priority: P0
  role: QA Engineer
  agent: AGENT-QA-001
  can_agent_execute: true
  dependencies:
  - T-QA-001
  - T-QA-002
  - T-QA-003
  - T-QA-004
  output_artifacts:
  - project/validation/items/EN-EDGE-001/qa-readiness.yaml
  - project/validation/items/EN-EDGE-001/test-cases.yaml
  evidence_expected:
  - Test cases derivados de project/agent-work/EN-EDGE-001/discovery.yaml.
  - Criterios para validar TimescaleDB, MQTT, ingestor, persistencia y healthcheck.
- id: T-QA-006
  title: Documentar guia de uso del framework QA/V&V
  type: TASK
  status: READY
  priority: P1
  role: Technical Writer / Developer Experience
  agent: AGENT-DOC-001
  can_agent_execute: true
  dependencies:
  - T-QA-001
  - T-QA-004
  output_artifacts:
