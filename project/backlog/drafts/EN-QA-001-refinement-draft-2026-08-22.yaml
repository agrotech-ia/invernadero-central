id: EN-QA-001
title: Implementar framework V&V y persistencia de evidencia
type: ENABLER
status: REFINEMENT
priority: P0
target: FOUNDATION
expert_role: QA Engineer
reviewer_role: Solution / IoT Architect
agent_owner: AGENT-QA-001
review_agent: AGENT-REV-001
source:
  backlog_parent: EN-QA-001
  decision_refs:
  - DEC-050
  - DEC-061
  - DEC-071
  - DEC-075
  - DEC-076
  evidence_refs:
  - project/validation/master-vv-matrix.yaml
  - project/validation/templates/test-case.yaml
  - project/agent-work/EN-EDGE-001/discovery.yaml
problem: El proyecto tiene reglas generales de evidencia, pero no un marco formal y reusable para cerrar HUs, validar V&V y evitar DONE sin pruebas verificables.
outcome: Sistema minimo de QA/V&V que define evidencia, gates Kanban, plantillas, indices y primer paquete QA para EN-EDGE-001.
scope:
  in:
  - Estructura estandar para evidencia por HU/enabler.
  - Reglas de paso a READY, VALIDATION y DONE.
  - Plantillas de test case, evidence index y validation report.
  - Checklist QA por tipo de trabajo: sensor, edge, web, hardware, docs, agent.
  - Primer paquete QA para EN-EDGE-001 usando el Discovery live.
  out:
  - Ejecutar pruebas fisicas reales.
  - Implementar ingestor MQTT->DB.
  - Cerrar HUs como DONE.
  - Aprobar compras, control fisico o despliegues criticos.
granularity:
  size: M
  rule: Dividir en tareas/HUs XS-S que puedan completarse en una o dos sesiones.
dependencies:
- id: EN-AGENT-001
  reason: Requiere agentes QA, Review, Documentation y Discovery operativos.
- id: EN-EDGE-001
  reason: Sirve como primer caso tecnico para validar evidencia end-to-end.
acceptance_criteria:
- El repositorio contiene una convencion documentada de evidencia por HU/enabler.
- Existe una plantilla de evidence index por item.
- Existe una plantilla de validation report por item.
- Existen reglas documentadas para READY, VALIDATION y DONE.
- EN-EDGE-001 tiene checklist QA inicial basado en Discovery.
- Ninguna regla exige evidencia imposible o no proporcional al tipo de trabajo.
definition_of_ready:
- EN-AGENT-001 tiene agentes QA/Reviewer/Documentation operativos.
- project/validation/master-vv-matrix.yaml existe.
- project/validation/templates/test-case.yaml existe.
- Discovery live de EN-EDGE-001 esta persistido como DRAFT.
- Riesgos y tipos de evidencia minima estan identificados.
definition_of_done:
- Plantillas QA versionadas.
- Reglas de gate documentadas.
- Primer paquete QA para EN-EDGE-001 creado como DRAFT.
- QA Agent revisa el paquete y recomienda siguiente estado.
- Reviewer confirma que no se marca DONE sin evidencia.
proposed_children:
