validation:
  vv_matrix_refs:
  - Raspberry/Edge
  - Web real-data
  - Suelo 7-en-1
  test_cases:
  - id: TC-QA-001
    title: Validar estructura de evidencia por item
    expected_evidence: evidence-taxonomy.yaml y evidence-index.yaml validos.
  - id: TC-QA-002
    title: Validar que EN-EDGE-001 tiene paquete QA inicial
    expected_evidence: qa-readiness.yaml y test-cases.yaml para EN-EDGE-001.
risks:
- risk: Crear demasiado proceso antes de ejecutar.
  mitigation: Mantener plantillas minimas y aplicarlas primero a EN-EDGE-001.
- risk: Marcar READY tareas que aun dependen de decision humana.
  mitigation: Las tareas son DRAFT hasta aprobacion; los gates separan recomendacion de decision.
- risk: Evidencia fisica no disponible inmediatamente.
  mitigation: Separar evidencia documental/local de evidencia fisica/lab.
human_approval_required_for:
- mover EN-QA-001 a READY o DONE
- cerrar items como DONE
- control fisico
- compras
- despliegues criticos
open_questions:
- Debemos usar YAML como formato unico para evidence-index y validation-report?
notes: Refinamiento DRAFT creado tras Discovery live de EN-EDGE-001.
